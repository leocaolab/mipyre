# pyre's engine as a Python extension; the repository root is a workspace only (see the root Cargo.toml).
[package]
name = "mipyre_pyext"
description = "The Python extension module `mipyre.engine` (maturin builds it; pyproject.toml names this manifest)"
version.workspace = true
edition.workspace = true
license.workspace = true

# maturin takes the module name from pyproject.toml's `module-name` and `#[pymodule] fn engine`,
# not from this; tests/test_request_path.py's layering rule and perf frames look for `mipyre_engine`.
[lib]
name = "mipyre_engine"
crate-type = ["cdylib"]

[features]
# Opt-in diagnostics for sub-interpreter leaks: a worker samples the reference count of
# each request's `Request` as it lets go of it into a `metrics` counter (one atomic
# increment per sample once the recorder is registered).
#
# Build with:
#   maturin develop --release --features leak_detect
# Snapshot the histogram from Python (handler or shutdown) via
#   mipyre.engine.leak_detect_dump()
leak_detect = ["mipyre_runtime/leak_detect"]

# In-process throughput harnesses: `MipyreApp.bench_inmem` (virtual
# connections, no TCP) and `MipyreApp.bench_loopback` (real TCP, client in
# the same process). Not compiled into the default build.
#
# Build with:
#   maturin develop --release --features bench
# then call either harness from Python.
bench = ["mipyre_server/bench", "dep:httparse", "dep:backtrace"]

# Start-phase timestamps: where a server's startup spends its time (the sub-interpreters'
# creation, their setup, the start gate). Each stamp goes to stderr in a build with this
# feature; off in every other build.
#
# Build with:
#   maturin develop --release --features startup_trace
# and run a server.
startup_trace = ["mipyre_runtime/startup_trace"]

# Test-only fault injection: `mipyre.engine._fault_panic(message)` panics in Rust, so a
# handler that calls it drives a real panic through the dispatch path that runs it (bridge,
# pool worker, TPC inline, GIL). Compiled out of every other build: a production wheel has
# no way to reach it.
#
# Build with:
#   maturin develop --release --features fault_injection
# then run `pytest tests/test_dispatch_paths.py -k panic`.
fault_injection = []

[dependencies]
# The domain packages.
mipyre_cpu = { path = "../cpu" }
mipyre_tpc = { path = "../tpc" }
mipyre_subinterp = { path = "../subinterp" }
# The errors of the shared-memory channel the server answers for.
mipyre_shm = { path = "../shm" }
# HTTP: the route table this engine instantiates with its Python handlers (`plan`), and the
# body, write coalescing and static files it serves through (`io`).
mipyre_http = { path = "../http" }
# The connections it serves: TCP listeners (or systemd's), TLS, in-process connections.
mipyre_transport = { path = "../transport" }
# The log throttles and the clock they run on.
mipyre_util = { path = "../util" }
# How a request handed to a Python backend gets its reply within the budget (`dispatch`, and the port the
# backends implement), and the timer that judges the budget of a call on this thread (`InlineTimer`).
mipyre_core = { path = "../core" }
# The process lanes' host side (`runtime="process"`); the worker's serve loop is mipyre_runtime's.
mipyre_process = { path = "../process" }
# What runs Python handlers, and the exchange between Python objects and HTTP; `pyapi/module.rs` registers its
# classes and functions and sets its per-interpreter state.
mipyre_runtime = { path = "../runtime" }
# The HTTP server the engine assembles and runs.
mipyre_server = { path = "../server" }
# A server run's Postgres pools and the handles to them; their Python face (`PgPool`) is `src/db/`.
mipyre_pg = { path = "../pg" }
# No `extension-module` feature (deprecated in PyO3 0.26+): maturin (>= 1.9.4, pinned in
# pyproject.toml) sets PYO3_BUILD_EXTENSION_MODULE when it builds the wheel, which leaves
# libpython unlinked there; a plain `cargo test` links libpython, so the unit-test binary
# links on macOS as on Linux.
pyo3 = "0.29"
# Not "full": its "process" feature makes every runtime's driver call
# `GlobalOrphanQueue::reap_orphans` on each park, which try-locks and locks two
# process-wide mutexes — every TPC thread, every time it waits for IO (seen as the
# top user-space HITM line in `perf c2c`). Nothing here spawns child processes
# through tokio.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "io-std", "fs", "parking_lot"] }
hyper = { version = "1.11", features = ["server", "http1", "http2"] }
bytes = "1"
matchit = "0.8"
serde_json = "1"
# pyproject.toml's [tool.mipyre] tables, with the line of every key for the errors; parsing only.
toml = { version = "0.9", default-features = false, features = ["std", "parse"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
mimalloc = { version = "0.1", default-features = false }
# Its options (`mi_option_set`), for `src/alloc.rs`; the same crate `mimalloc` links.
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
# The clock a site times answers by (mipyre_server's `Site`).
quanta = { version = "0.12", default-features = false }
# The system calls it has safe calls for (a lane worker's parent, telemetry, the asyncio doorbell); libc keeps the
# rest.
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "net", "param", "pipe", "process", "shm", "thread", "time"] }
thiserror = "2"
pythonize = "0.29"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "json",
    "macros",
] }

# Optional — pulled in only by the `bench` feature (the bench client parses response heads).
httparse = { version = "1", optional = true }
# The bench's allocation profile records allocating call stacks.
backtrace = { version = "0.3", optional = true }

[dev-dependencies]
mipyre_runtime = { path = "../runtime", features = ["testkit"] }
proptest = "1"
# The fuzz target of the NUMERIC decoder (src/db/numeric/fuzz.rs): `cargo test` replays its committed corpus,
# `cargo bolero test` mutates it under libFuzzer.
# Exactly 0.13.4: from 0.13.5 on its derive crate pins indexmap to =2.11.2, which would move the workspace's
# shipping indexmap (h2, sqlx) back from 2.14.
bolero = "=0.13.4"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
