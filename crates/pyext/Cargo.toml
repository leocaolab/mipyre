# pyre's engine as a Python extension (b/51 E0b: moved here from the repository root, which is now a
# workspace only — see the root Cargo.toml).
[package]
name = "mipyre_pyext"
description = "The Python extension module `mipyre.engine` (maturin builds it; pyproject.toml names this manifest)"
version.workspace = true
edition.workspace = true
license.workspace = true

# maturin takes the module name from pyproject.toml's `module-name` and `#[pymodule] fn engine`,
# not from this; tests/test_final_w2.py's layering rule and benchmarks/bench_profile.py look for
# `mipyre_engine` (in source and in perf frames).
[lib]
name = "mipyre_engine"
crate-type = ["cdylib"]

[features]
# Opt-in diagnostics for sub-interpreter leaks: a worker samples the reference count of
# each request's `Request` as it lets go of it into a `metrics` counter (one atomic
# increment per sample once the recorder is registered).
#
# Build with:
#   maturin develop --release --features leak_detect
# Snapshot the histogram from Python (handler or shutdown) via
#   mipyre.engine.leak_detect_dump()
# See docs/memory-leak-investigation-2026-04-19.md for how it pinned down the
# sub-interpreter finalizer bug.
leak_detect = ["dep:metrics", "dep:metrics-util"]

# In-process throughput harnesses: `MipyreApp.bench_inmem` (virtual
# connections, no TCP) and `MipyreApp.bench_loopback` (real TCP, client in
# the same process). Not compiled into the default build.
#
# Build with:
#   maturin develop --release --features bench
# then run the scripts in benchmarks/ (bench_inmem*.py, bench_loopback*.py).
bench = ["dep:httparse", "dep:backtrace"]

# Start-phase timestamps: where a server's startup spends its time (the sub-interpreters'
# creation, their setup, the start gate). Each stamp goes to stderr when
# `MIPYRE_B183_TRACE=1` is set in the environment; off in every other build.
#
# Build with:
#   maturin develop --release --features startup_trace
# and run a server with MIPYRE_B183_TRACE=1; `benchmarks/bench_startup.py` measures the total.
startup_trace = ["mipyre_subinterp/startup_trace"]

# Test-only fault injection: `mipyre.engine._fault_panic(message)` panics in Rust, so a
# handler that calls it drives a real panic through the dispatch path that runs it (bridge,
# pool worker, TPC inline, GIL). Compiled out of every other build: a production wheel has
# no way to reach it.
#
# Build with:
#   maturin develop --release --features fault_injection
# then run `pytest tests/test_review_ra.py -k panic`.
fault_injection = []

[dependencies]
# The domain packages (crates/README.md).
mipyre_cpu = { path = "../cpu" }
mipyre_tpc = { path = "../tpc" }
mipyre_subinterp = { path = "../subinterp" }
# The process lanes' shared-memory channel: the ring's counter checks, the slot header, the spin window.
mipyre_shm = { path = "../shm" }
# HTTP: the route table this engine instantiates with its Python handlers (`plan`), and the
# body, write coalescing and static files it serves through (`io`).
mipyre_http = { path = "../http" }
# The connections it serves: TCP listeners (or systemd's), TLS, in-process connections.
mipyre_transport = { path = "../transport" }
# The log throttles and the clock they run on.
mipyre_util = { path = "../util" }
# No `extension-module` feature (deprecated in PyO3 0.26+): maturin (>= 1.9.4, pinned in
# pyproject.toml) sets PYO3_BUILD_EXTENSION_MODULE when it builds the wheel, which leaves
# libpython unlinked there; a plain `cargo test` links libpython, so the unit-test binary
# links on macOS as on Linux.
pyo3 = "0.29"
# Not "full": its "process" feature makes every runtime's driver call
# `GlobalOrphanQueue::reap_orphans` on each park, which try-locks and locks two
# process-wide mutexes — every TPC thread, every time it waits for IO (seen as the
# top user-space HITM line in `perf c2c`). Nothing here spawns child processes
# through tokio.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "io-std", "fs", "signal", "parking_lot"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
matchit = "0.8"
serde_json = "1"
# The access log's numbers, as serde_json writes them (telemetry/access_line.rs).
itoa = "1"
parking_lot = "0.12"
form_urlencoded = "1"
percent-encoding = "2"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
tokio-tungstenite = "0.26"
tungstenite = "0.26"
# base64 and sha1 provided transitively by tungstenite
futures-util = "0.3"
dashmap = "6"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
mimalloc = { version = "0.1", default-features = false }
# Its options (`mi_option_set`), for `src/alloc.rs`; the same crate `mimalloc` links.
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
# The system calls it has safe calls for (process lanes, telemetry); libc keeps the rest, in
# `lane/os.rs` and `telemetry/monitor.rs`.
rustix = { version = "1.1.5", default-features = false, features = ["std", "event", "fs", "net", "param", "pipe", "process", "shm", "thread", "time"] }
thiserror = "2"
core_affinity = "0.8"
pythonize = "0.29"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
pin-project-lite = "0.2"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "json",
    "macros",
] }

# Optional — pulled in only by the `leak_detect` feature.
metrics = { version = "0.24", optional = true }
metrics-util = { version = "0.19", features = ["debugging"], optional = true }

# Optional — pulled in only by the `bench` feature (the bench client parses response heads).
httparse = { version = "1", optional = true }
# The bench's allocation profile records allocating call stacks.
backtrace = { version = "0.3", optional = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["test-util"] }

# The Loom models (`src/runtime/live_workers/loom_model.rs`), built only under `--cfg sync_model`, which swaps `src/sync.rs`'s names
# for Loom's in this crate and in every package built with it, so Loom is a dependency under that cfg only:
# `RUSTFLAGS="--cfg sync_model" cargo test -p mipyre_pyext --lib --release --target-dir target/loom loom`.
[target.'cfg(sync_model)'.dependencies]
loom = "0.7"

[lints]
workspace = true
