[package]
name = "mipyre_util"
description = "Tools below every layer of pyre that know no business: the monotonic clock log throttles run on, and the log throttles (LogThrottle, and ThrottleState for callers that keep many under a lock)"
version.workspace = true
edition.workspace = true
license.workspace = true

# Nothing but std, as README.md says and dev/archcheck.toml E-P13 checks.
[dependencies]

[dev-dependencies]
# The microbenches' harness and counting allocator.
mipyre_microbench = { path = "../microbench" }
proptest = "1"

[lints]
workspace = true

# The per-call bench (`mipyre_microbench::run`).
[[bench]]
name = "throttle"
harness = false
