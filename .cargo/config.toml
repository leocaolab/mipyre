# Every `cargo test` / `cargo nextest` run in this tree runs each proptest on the same inputs, so a failure
# reproduces. A run that sets PROPTEST_RNG_SEED itself keeps its own (the
# nightly run: random seed, PROPTEST_CASES large).
#
# No run writes a failure's shrunk input to a proptest-regressions/ file beside the source, which would leave a CI
# checkout dirty. proptest prints the shrunk input with the failure; the fix adds it as an explicit test case, which
# every run replays. proptest reads the variable's presence, not its value.
[env]
PROPTEST_RNG_SEED = "2749"
PROPTEST_DISABLE_FAILURE_PERSISTENCE = "1"
