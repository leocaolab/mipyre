[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "mipyre"
dynamic = ["version"]
description = "A Python web framework with a Rust HTTP server, running Python handlers in parallel on every core in one process"
requires-python = ">=3.14"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: AsyncIO",
]
dependencies = ["isojson>=0.3"]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    # The gate runs the suite on several workers (`-n`, b/156); `--dist loadgroup` honours
    # `@pytest.mark.xdist_group`, which pins tests that must not run beside each other to one worker.
    "pytest-xdist>=3.6",
    # The one wall clock a test is held to (b/441): `timeout` below, a hang guard, not a criterion. A wait for an
    # event waits for the event alone (`poll_until(..., timeout=None)`); this ends the test that never gets it.
    "pytest-timeout>=2.3",
    "httpx",
    "h2",
    "websockets",
    "pydantic",
    "numpy",
    "msgpack",
    # tests/test_isojson_numpy_workers.py does a bare `import orjson` (so a missing orjson
    # is a collection error, not a skip) and asserts this exact version: orjson is the
    # byte reference its output is compared against. The pin belongs here, not in the
    # assertion — but the assertion is what names the version, so the two move together.
    "orjson==3.12.0",
    "pydantic-settings>=2",
    "watchfiles",
    "hypothesis",
    # The merge gate installs this extra (plus isojson), so these are the gate's test deps too,
    # and a local venv has them as well (b/147).
    # tests/test_isolate_shared_ext.py and tests/test_blas_threads_isolated.py importorskip scipy and
    # threadpoolctl: missing = skip, and the gate's skip check (dev/skip_gate.py) makes a skip red.
    "scipy",
    "threadpoolctl",
    # tests/test_process_lane.py imports polars; tests/test_final_w2.py runs maturin next to the test python.
    "polars",
    "maturin>=1.9.4,<2.0",
    # tests/test_openapi.py (b/748): the generated document is checked against the official OpenAPI 3.1 schema,
    # and Schemathesis sends the requests that document describes to a served app.
    "openapi-spec-validator>=0.7",
    "schemathesis>=4",
]
# The merge gate's lint step installs this extra and runs `ruff check` and mypy (b/56). Pinned: a new release
# that adds a check would turn main red with no change in the tree. Check only; the repo has no formatter.
lint = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    # dev/gate_timing.py reads merge.yml with PyYAML; its stubs let mypy check that use.
    "types-PyYAML==6.0.12.20260906",
    # examples/trading/analytics.py imports pandas, which the lint venv does not install; its stubs let mypy check it.
    "pandas-stubs==3.0.5.260914",
]

# Not extras: a dependency group is not in the wheel's metadata.
[dependency-groups]
# The pandas tier of the process-lane chaos soak (benchmarks/process_lane_e2e/tiers.py); the rest of what it imports
# is in the `test` extra.
process-lane-e2e = ["pandas"]

[project.scripts]
mipyre = "mipyre.cli:main"

[tool.maturin]
# The engine is a workspace member, not the root (b/51 E0b); the wheel and the module are unchanged.
manifest-path = "crates/pyext/Cargo.toml"
python-source = "python"
module-name = "mipyre.engine"

[tool.pytest.ini_options]
# Put the project root on sys.path so tests that do
# `from tests.conftest import feature_server_factory` resolve whether
# pytest is invoked as `pytest tests/` or `python -m pytest tests/`.
# `python -m` prepends cwd automatically; bare `pytest` does not, and
# the test_*_e2e files depend on the tests package being importable.
pythonpath = ["."]
# An unknown marker is an error, not a silently ignored typo; an xfail that passes fails (b/53 E1-2, design §5.1).
addopts = "--strict-markers"
xfail_strict = true
# Hang guard (b/441): a test still running after this many seconds fails with every thread's stack. Wide on purpose:
# no test is judged by its time; dev/test_time_gate.py judges what each test asked for (sleep seconds, work).
timeout = 300

# A suppression is a decision, and each one says what it suppresses and why (b/56, b/51 event 339): a `# noqa`
# names its code (PGH004) and is red once nothing is left to suppress (RUF100); a `# type: ignore` names its
# error code (PGH003 here, `ignore-without-code` in mypy) and is red once unused (`warn_unused_ignores`). The
# reason follows the code on the same line, and dev/suppressions.py counts every one of them per file
# against dev/suppressions.txt.
[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Named, not ruff's defaults (which a ruff release may widen): pyflakes and pycodestyle's E4/E7/E9; BLE001, an
# `except Exception` / `except BaseException` that neither re-raises nor logs it (the tree already marks the
# deliberate ones `# noqa: BLE001 — why`); S102, `exec`; and the three checks on suppressions themselves.
select = ["E4", "E7", "E9", "F", "BLE001", "S102", "PGH003", "PGH004", "RUF100"]

[tool.mypy]
python_version = "3.14"
# Of benchmarks/, only what the merge gate runs: merge.yml's microbench step (bench_micro_count.py) and the board it
# imports. The other scripts there and arena_submission/ are run by hand and are not checked (b/773).
files = ["python/mipyre", "tests", "examples"]
# benchmarks/ and examples/ as well, where bench_micro_count.py finds `_board` and the examples their packages
# (`fullstack.main`): a script run as `python <dir>/<script>.py` has its own directory on sys.path.
mypy_path = ["python", "examples"]
explicit_package_bases = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]

# Installed and untyped (no stubs, no py.typed): read their source rather than treat every name as Any.
[[tool.mypy.overrides]]
module = ["msgpack", "msgpack.*", "threadpoolctl"]
follow_untyped_imports = true
